[env:ardo]
platform = espressif32
board = esp32s3-n16r8
framework = espidf

; Upload y monitor por el puerto USB nativo (USB-OTG, puerto derecho del DevKit)
upload_protocol = esptool
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 115200

; sdkconfig con overrides para PSRAM, WiFi, BLE, I2S, WakeNet
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"

; Tabla de particiones personalizada (necesaria para WakeNet + 16MB)
board_build.partitions = partitions.csv

build_flags = 
    -I lib/microfrontend/src