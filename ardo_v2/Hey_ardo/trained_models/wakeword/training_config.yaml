average_window_duration_ms: 100
batch_size: 32
clip_duration_ms: 1000
detection_threshold: 0.5
eval_batch_size: 32
eval_nonstreaming: false
eval_step_interval: 500
features:
- features_dir: generated_augmented_features
  penalty_weight: 1.0
  sampling_weight: 2.0
  truncation_strategy: truncate_start
  truth: true
  type: mmap
- features_dir: features_mis_audios_negativos
  penalty_weight: 3.0
  sampling_weight: 15.0
  truncation_strategy: random
  truth: false
  type: mmap
- features_dir: features_generated_hard_negatives
  penalty_weight: 2.5
  sampling_weight: 12.0
  truncation_strategy: random
  truth: false
  type: mmap
- features_dir: negative_datasets/spanish_speech
  penalty_weight: 2.0
  sampling_weight: 10.0
  truncation_strategy: random
  truth: false
  type: mmap
- features_dir: negative_datasets/speech
  penalty_weight: 1.0
  sampling_weight: 8.0
  truncation_strategy: random
  truth: false
  type: mmap
- features_dir: negative_datasets/dinner_party
  penalty_weight: 1.0
  sampling_weight: 8.0
  truncation_strategy: random
  truth: false
  type: mmap
- features_dir: negative_datasets/no_speech
  penalty_weight: 1.0
  sampling_weight: 4.0
  truncation_strategy: random
  truth: false
  type: mmap
- features_dir: negative_datasets/dinner_party_eval
  penalty_weight: 1.0
  sampling_weight: 0.0
  truncation_strategy: split
  truth: false
  type: mmap
flags:
  first_conv_filters: 32
  first_conv_kernel_size: 5
  max_pool: 0
  mixconv_kernel_sizes: '[5], [7,11], [9,15], [23]'
  model_name: mixednet
  pointwise_filters: 64,64,64,64
  pooled: 0
  repeat_in_block: 1,1,1,1
  residual_connection: 0,0,0,0
  restore_checkpoint: 0
  spatial_attention: 0
  stride: 2
  test_tf_nonstreaming: 0
  test_tflite_nonstreaming: 0
  test_tflite_nonstreaming_quantized: 0
  test_tflite_streaming: 0
  test_tflite_streaming_quantized: 1
  train: 1
  training_config: training_parameters.yaml
  use_weights: best_weights
  verbosity: 0
