- 2
freq_mask_max_size:
- 5
learning_rates:
- 0.001
- 0.0001
maximization_metric: average_viable_recall
minimization_metric: ambient_false_positives_per_hour
minimum_count: 3
negative_class_weight:
- 10
- 30
positive_class_weight:
- 1
- 1
primary_metric: accuracy
save_step_interval: 500
spectrogram_length: 153
spectrogram_length_final_layer: 49
stride: 2
summaries_dir: trained_models/wakeword/logs/
suppression_ms: 500
target_minimization: 0.5
time_mask_count:
- 2
time_mask_max_size:
- 5
train_dir: trained_models/wakeword
training_input_shape: !!python/tuple
- 153
- 40
training_steps:
- 20000
- 5000
window_step_ms: 10
